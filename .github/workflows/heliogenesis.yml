name: Browser integrations

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: browser-integrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: ${{ matrix.integration }} browser tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        integration:
          - document-looks-back
          - heliogenesis
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Test ${{ matrix.integration }}
        run: nix run .#test-${{ matrix.integration }}
